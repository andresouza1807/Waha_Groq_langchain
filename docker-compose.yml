services:
  evolution_db:
    image: postgres:15-alpine
    container_name: evolution_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    volumes:
      - evolution-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - evolution_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    networks:
      default:
        aliases:
          - evolution_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - EVOLUTION_API_URL=http://localhost:3333
      - EVOLUTION_INSTANCE_NAME=default
    depends_on:
      evolution_db:
        condition: service_healthy
      evolution_redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  evolution-data:
